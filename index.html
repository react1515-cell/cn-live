<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중국어 라이브 파트너 (비즈니스 & 일상)</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 16px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.1rem; color: #38bdf8; }
    .status { font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; background: #334155; color: #94a3b8; }
    .status.connected { background: #065f46; color: #34d399; }
    .controls { padding: 16px 20px; background: #1e293b; display: flex; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #334155; }
    select, input { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; }
    select { flex: 1; min-width: 220px; }
    input { width: 140px; }
    button { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    #btnStart { background: #0284c7; color: white; }
    #btnStart:hover { background: #0369a1; }
    #btnStop { background: #e11d48; color: white; display: none; }
    #chatLog { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 85%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; }
    .msg.ai { background: #1e293b; border: 1px solid #334155; align-self: flex-start; color: #f8fafc; }
    .msg.user { background: #0369a1; border: 1px solid #0284c7; align-self: flex-end; color: #ffffff; }
    .msg.user .label { font-size: 0.75rem; color: #bae6fd; margin-bottom: 4px; }
    .msg.sys { background: transparent; color: #94a3b8; font-size: 0.85rem; align-self: center; text-align: center; }
    .msg.err { background: #450a0a; border: 1px solid #991b1b; color: #fca5a5; font-size: 0.85rem; align-self: center; text-align: center; }
    .zh-simp { font-size: 1.2rem; font-weight: 600; color: #ffffff; margin-bottom: 4px; }
    .zh-pinyin { font-size: 0.95rem; color: #38bdf8; margin-bottom: 8px; font-family: monospace, sans-serif; }
    .ko-mean { font-size: 0.95rem; color: #cbd5e1; padding-top: 8px; border-top: 1px dashed #475569; }
    .loading-sub { font-size: 0.8rem; color: #64748b; margin-top: 4px; }
    footer { padding: 14px 20px; background: #1e293b; border-top: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #94a3b8; }
    .mic-indicator { display: flex; align-items: center; gap: 8px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; }
    .dot.active { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  </style>
</head>
<body>

<header>
  <h1>🇨🇳 중국어 라이브 파트너 (简体 · 拼音)</h1>
  <span id="statusBadge" class="status">연결 대기중</span>
</header>

<div class="controls">
  <select id="scenarioSelect">
    <optgroup label="💼 비즈니스 실무 (기초·중급)">
      <option value="단가가 조금 비싸서 가격을 조금 깎아달라고 가볍게 협상하기">1. 단가 깎아달라고 부탁하기</option>
      <option value="물건이 언제 도착하는지 납기 일정 확인하기">2. 배송 및 납기 일정 확인하기</option>
      <option value="원단 샘플이 마음에 들어서 수량과 조건 물어보기">3. 샘플 확인 및 주문 수량 문의</option>
      <option value="거래처 담당자와 미팅 시작 전 가볍게 안부 묻고 차 마시기">4. 미팅 전 가벼운 스몰토크</option>
    </optgroup>
    <optgroup label="☕ 일상생활 회화">
      <option value="중국 출장 중 식당에서 맛있는 현지 음식 추천받고 주문하기">5. 식당에서 음식 추천받고 주문하기</option>
      <option value="주말에 무엇을 했는지, 평소 운동이나 취미 생활 이야기하기">6. 주말 일상 및 운동/취미 대화</option>
      <option value="택시를 타거나 호텔 체크인할 때 기본적인 요청하기">7. 출장 중 택시·호텔 이용하기</option>
      <option value="주제 없이 편하게 오늘 하루 있었던 일 수다 떨기">8. 자유 주제 일상 프리토킹</option>
    </optgroup>
  </select>
  <input type="password" id="accessCode" placeholder="비밀번호 입력" />
  <button id="btnStart" onclick="startSession()">대화 시작</button>
  <button id="btnStop" onclick="stopSession('사용자가 대화를 종료했습니다.')">대화 종료</button>
</div>

<div id="chatLog">
  <div class="msg sys">🎧 <b>이어폰 또는 헤드셋</b>을 착용한 뒤 원하는 주제를 고르고 [대화 시작]을 눌러주세요.</div>
</div>

<footer>
  <div class="mic-indicator"><div id="micDot" class="dot"></div><span id="micText">마이크 꺼짐</span></div>
  <div>내 발음 인식 + 간체/병음/해석 지원</div>
</footer>

<script>
  // ▼▼▼ 아래 작은따옴표 안에 복사해 둔 Apps Script 웹 앱 URL을 붙여넣으세요 ▼▼▼
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyTikvgzO00McK5Wg12BiD-Qk55OGVv_7iPWSzlbsb-CIA7SqrpO4s3e30ImeX6WsCu/exec';

  let ws = null;
  let audioCtx = null;
  let micCtx = null;
  let micStream = null;
  let processor = null;
  let nextPlayTime = 0;

  let currentAiBubble = null;
  let currentAiTranscript = '';

  let currentUserBubble = null;
  let currentUserTranscript = '';

  const savedCode = localStorage.getItem('cn_trade_code');
  if (savedCode) document.getElementById('accessCode').value = savedCode;

  function addSystemMsg(text, isError = false) {
    const div = document.createElement('div');
    div.className = isError ? 'msg err' : 'msg sys';
    div.innerText = text;
    const log = document.getElementById('chatLog');
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  // 내가 말한 음성 인식 말풍선 업데이트 (오른쪽 파란색)
  function updateUserBubble(deltaText) {
    const log = document.getElementById('chatLog');
    if (!currentUserBubble) {
      currentUserBubble = document.createElement('div');
      currentUserBubble.className = 'msg user';
      currentUserBubble.innerHTML = `<div class="label">🎙️ 내 발음 인식</div><div class="zh-simp"></div>`;
      log.appendChild(currentUserBubble);
    }
    currentUserTranscript += deltaText;
    currentUserBubble.querySelector('.zh-simp').innerText = currentUserTranscript;
    log.scrollTop = log.scrollHeight;
  }

  // AI 대답 말풍선 업데이트 (왼쪽 어두운색)
  function updateAiBubble(deltaText) {
    const log = document.getElementById('chatLog');
    if (!currentAiBubble) {
      currentAiBubble = document.createElement('div');
      currentAiBubble.className = 'msg ai';
      currentAiBubble.innerHTML = `<div class="zh-simp"></div><div class="loading-sub">병음 및 한국어 뜻 생성 중...</div>`;
      log.appendChild(currentAiBubble);
    }
    currentAiTranscript += deltaText;
    currentAiBubble.querySelector('.zh-simp').innerText = currentAiTranscript;
    log.scrollTop = log.scrollHeight;
  }

  async function enrichSubtitle(bubbleEl, rawChinese) {
    if (!bubbleEl || !rawChinese.trim()) return;
    try {
      const cnRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=${encodeURIComponent(rawChinese)}`);
      const cnData = await cnRes.json();
      const simpText = cnData[0].map(item => item[0] || '').join('');

      const koRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=ko&dt=t&dt=rm&q=${encodeURIComponent(simpText)}`);
      const koData = await koRes.json();
      const koText = koData[0].map(item => item[0] || '').join('');
      const pinyinText = koData[0].map(item => item[3] || item[2] || '').join(' ').trim();

      bubbleEl.innerHTML = `
        <div class="zh-simp">${simpText}</div>
        ${pinyinText ? `<div class="zh-pinyin">${pinyinText}</div>` : ''}
        <div class="ko-mean">🇰🇷 ${koText}</div>
      `;
      const log = document.getElementById('chatLog');
      log.scrollTop = log.scrollHeight;
    } catch (e) {
      const sub = bubbleEl.querySelector('.loading-sub');
      if (sub) sub.innerText = '';
    }
  }

  async function startSession() {
    const code = document.getElementById('accessCode').value.trim();
    const scenario = document.getElementById('scenarioSelect').value;
    if (!code) return alert('Apps Script에 설정한 비밀번호(ACCESS_CODE)를 입력해주세요.');
    if (APPS_SCRIPT_URL.includes('여기에_복사한')) return alert('코드 상단의 APPS_SCRIPT_URL에 웹 앱 주소를 먼저 넣어주세요.');

    localStorage.setItem('cn_trade_code', code);
    document.getElementById('btnStart').disabled = true;
    addSystemMsg('서버에서 임시 보안 토큰을 발급받는 중...');

    try {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ code, scenario })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
      });

      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContentConstrained?access_token=${encodeURIComponent(data.token)}`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        document.getElementById('statusBadge').innerText = '세션 초기화 중...';
        ws.send(JSON.stringify({ setup: {} }));
      };

      ws.onmessage = async (event) => {
        const raw = event.data instanceof Blob ? await event.data.text() : event.data;
        const msg = JSON.parse(raw);

        if (msg.setupComplete !== undefined) {
          document.getElementById('statusBadge').innerText = '실시간 연결됨';
          document.getElementById('statusBadge').classList.add('connected');
          document.getElementById('btnStart').style.display = 'none';
          document.getElementById('btnStop').style.display = 'inline-block';
          addSystemMsg('✅ 연결되었습니다! AI가 먼저 쉽게 말을 건넵니다.');

          ws.send(JSON.stringify({
            clientContent: {
              turns: [{ role: 'user', parts: [{ text: '你好！请用简单易懂的简体中文，根据设定的场景先向我打招呼，问一个简单的问题。' }] }],
              turnComplete: true
            }
          }));
          startMicStreaming();
          return;
        }

        if (msg.serverContent) {
          const sc = msg.serverContent;
          
          if (sc.modelTurn && sc.modelTurn.parts) {
            for (const part of sc.modelTurn.parts) {
              if (part.inlineData && part.inlineData.data) {
                playPcm24k(part.inlineData.data);
              }
            }
          }

          // 1. 내가 말한 음성 인식 결과 수신
          if (sc.inputTranscription && sc.inputTranscription.text) {
            updateUserBubble(sc.inputTranscription.text);
          }

          // 2. AI가 말한 음성 자막 수신 (AI가 말하기 시작하면 내 말풍선 턴은 종료)
          if (sc.outputTranscription && sc.outputTranscription.text) {
            currentUserBubble = null;
            currentUserTranscript = '';
            updateAiBubble(sc.outputTranscription.text);
          }

          if (sc.turnComplete) {
            if (currentAiBubble && currentAiTranscript) {
              enrichSubtitle(currentAiBubble, currentAiTranscript);
            }
            currentAiBubble = null;
            currentAiTranscript = '';
          }
        }
      };

      ws.onclose = (ev) => {
        const reasonText = ev.reason ? `사유: ${ev.reason}` : '사유 없음';
        stopSession(`연결 종료 (코드: ${ev.code}, ${reasonText})`, ev.code !== 1000);
      };

      ws.onerror = (err) => {
        console.error(err);
        addSystemMsg('웹소켓 통신 에러가 감지되었습니다.', true);
      };

    } catch (err) {
      addSystemMsg('연결 실패: ' + err.message, true);
      document.getElementById('btnStart').disabled = false;
    }
  }

  function startMicStreaming() {
    micCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const source = micCtx.createMediaStreamSource(micStream);
    processor = micCtx.createScriptProcessor(4096, 1, 1);

    processor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const input = e.inputBuffer.getChannelData(0);
      const pcm16 = new Int16Array(input.length);
      for (let i = 0; i < input.length; i++) {
        const s = Math.max(-1, Math.min(1, input[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }
      const base64 = btoa(String.fromCharCode(...new Uint8Array(pcm16.buffer)));
      ws.send(JSON.stringify({
        realtimeInput: { mediaChunks: [{ mimeType: 'audio/pcm;rate=16000', data: base64 }] }
      }));
    };

    source.connect(processor);
    processor.connect(micCtx.destination);
    document.getElementById('micDot').classList.add('active');
    document.getElementById('micText').innerText = '마이크 켜짐 (말씀하세요)';
  }

  function playPcm24k(base64Data) {
    if (!audioCtx) return;
    const binary = atob(base64Data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const int16 = new Int16Array(bytes.buffer);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768.0;

    const buffer = audioCtx.createBuffer(1, float32.length, 24000);
    buffer.getChannelData(0).set(float32);

    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(audioCtx.destination);

    const now = audioCtx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now;
    source.start(nextPlayTime);
    nextPlayTime += buffer.duration;
  }

  function stopSession(reason = '대화를 종료했습니다.', isError = false) {
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    if (processor) { processor.disconnect(); processor = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (micCtx) { micCtx.close(); micCtx = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    nextPlayTime = 0;
    currentAiBubble = null;
    currentAiTranscript = '';
    currentUserBubble = null;
    currentUserTranscript = '';

    document.getElementById('statusBadge').innerText = '연결 대기중';
    document.getElementById('statusBadge').classList.remove('connected');
    document.getElementById('micDot').classList.remove('active');
    document.getElementById('micText').innerText = '마이크 꺼짐';
    document.getElementById('btnStart').style.display = 'inline-block';
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').style.display = 'none';
    addSystemMsg(reason, isError);
  }
</script>
</body>
</html>
